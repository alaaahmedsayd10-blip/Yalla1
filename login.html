<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yalla City — تسجيل الدخول</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#101827,#202d48);color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:#182338;border:1px solid #3b4962;border-radius:20px;padding:26px;box-shadow:0 18px 55px #0006}h1{margin:0 0 8px;font-size:26px}p{color:#bdc8da;line-height:1.6;margin:0 0 20px}.field{display:grid;gap:7px;margin:14px 0}label{font-size:14px;color:#dbeafe}input{width:100%;padding:13px 14px;border:1px solid #475569;border-radius:10px;background:#0e1728;color:white;font:inherit;outline:none}input:focus{border-color:#a78bfa}button{width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}.primary{background:#8b5cf6;color:white}.secondary{background:#29364e;color:#e5e7eb;border:1px solid #475569}.message{min-height:24px;margin-top:14px;font-size:14px;color:#fca5a5}.hint{font-size:12px;color:#94a3b8;margin-top:16px}
  </style>
</head>
<body>
  <main class="card">
    <h1>🌆 أهلاً بك في Yalla City</h1>
    <p>سجّل دخولك أو أنشئ حسابًا جديدًا. الحساب الجديد يبدأ بـ 5 جولد.</p>
    <form id="auth-form">
      <div class="field"><label for="phone">رقم التليفون</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثال: 01012345678" required maxlength="20"></div>
      <div class="field"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="6 أحرف على الأقل" required></div>
      <button class="primary" id="login" type="submit">تسجيل الدخول</button>
      <button class="secondary" id="signup" type="button">إنشاء حساب جديد</button>
    </form>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <div class="hint">كلمة المرور تُدار بأمان عبر Firebase Authentication ولا يتم تخزينها كنص أو كهاش في مستند المستخدم.</div>
  </main>
  <script src="https://play.workadventu.re/iframe_api.js"></script>
  <script src="./firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

    const config = window.YALLA_FIREBASE_CONFIG;
    const app = initializeApp(config);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const form = document.getElementById('auth-form');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');
    const loginButton = document.getElementById('login');
    const signupButton = document.getElementById('signup');
    let busy = false;

    // Firebase email/password auth does not support phone+password directly.
    // A deterministic internal email is used as the Auth identifier; the public profile stores the phone.
    function normalizePhone(value) { return value.trim().replace(/[\s()+-]/g, ''); }
    function phoneToEmail(phone) {
      const digits = normalizePhone(phone);
      if (!/^\d{8,15}$/.test(digits)) throw new Error('اكتب رقم تليفون صحيحًا بالأرقام فقط، من 8 إلى 15 رقمًا.');
      return `${digits}@phone.yalla-city.app`;
    }
    function showError(error) {
      const code = error?.code || '';
      const friendly = {
        'auth/invalid-credential': 'رقم التليفون أو كلمة المرور غير صحيحة.',
        'auth/email-already-in-use': 'هذا الرقم مسجل بالفعل. جرّب تسجيل الدخول.',
        'auth/weak-password': 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.',
        'auth/too-many-requests': 'محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.',
        'auth/network-request-failed': 'تعذر الاتصال بالإنترنت. حاول مرة أخرى.',
        'permission-denied': 'رفضت قواعد Firestore العملية. تأكد من نشر firestore.rules.'
      };
      message.textContent = friendly[code] || error?.message || 'حصل خطأ غير متوقع.';
    }
    async function finishLogin(user, phone) {
      const ref = doc(db, 'users', user.uid);
      const profile = await getDoc(ref);
      if (!profile.exists()) {
        // Existing Auth accounts without a profile are not silently given extra currency.
        await setDoc(ref, { phone, gold: 5, animals: [], createdAt: serverTimestamp() });
      }
      localStorage.setItem('yalla_user_uid', user.uid);
      localStorage.setItem('yalla_user_phone', phone);
      if (window.WA?.ui?.modal?.closeModal) window.WA.ui.modal.closeModal();
      else document.querySelector('.card').innerHTML = '<h1>تم تسجيل الدخول ✅</h1><p>ارجع إلى نافذة اللعبة لإكمال اللعب.</p>';
    }
    async function run(action) {
      if (busy) return;
      busy = true; loginButton.disabled = true; signupButton.disabled = true; message.style.color = '#c4b5fd'; message.textContent = 'جارٍ الاتصال...';
      try {
        await setPersistence(auth, browserLocalPersistence);
        const phone = normalizePhone(phoneInput.value);
        const email = phoneToEmail(phone);
        const password = passwordInput.value;
        if (password.length < 6) throw new Error('كلمة المرور يجب أن تكون 6 أحرف على الأقل.');
        let credential;
        if (action === 'signup') {
          credential = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, 'users', credential.user.uid), { phone, gold: 5, animals: [], createdAt: serverTimestamp() });
        } else {
          credential = await signInWithEmailAndPassword(auth, email, password);
          const profile = await getDoc(doc(db, 'users', credential.user.uid));
          if (!profile.exists()) throw new Error('حساب المصادقة موجود لكن ملف اللاعب غير موجود. تواصل مع الإدارة.');
        }
        await finishLogin(credential.user, phone);
      } catch (error) { showError(error); }
      finally { busy = false; loginButton.disabled = false; signupButton.disabled = false; if (message.textContent === 'جارٍ الاتصال...') message.textContent = ''; }
    }
    form.addEventListener('submit', (event) => { event.preventDefault(); void run('login'); });
    signupButton.addEventListener('click', () => void run('signup'));
  </script>
</body>
</html>
