name: Integrate Great Place to Work map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack map files without overwriting existing project files
        run: |
          test -f Yalla1-great-place-to-work-integration.zip
          unzip -n -q Yalla1-great-place-to-work-integration.zip -d .
          test -f "wam-preset-hackathon-master (1).zip"
          mkdir -p /tmp/hackathon-archive
          unzip -n -q "wam-preset-hackathon-master (1).zip" -d /tmp/hackathon-archive
          echo "Hackathon archive contents (first 100 paths):"
          find /tmp/hackathon-archive -maxdepth 4 -type f | head -100
          # Merge the archive into the project without replacing any existing files.
          # If the ZIP has a single top-level project folder, merge its contents;
          # otherwise merge the extracted directory itself.
          roots=$(find /tmp/hackathon-archive -mindepth 1 -maxdepth 1 -type d | wc -l)
          files=$(find /tmp/hackathon-archive -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$roots" -eq 1 ] && [ "$files" -eq 0 ]; then
            source_dir=$(find /tmp/hackathon-archive -mindepth 1 -maxdepth 1 -type d | head -1)
          else
            source_dir=/tmp/hackathon-archive
          fi
          cp -rn "$source_dir"/. .
          echo "Map files found after safe merge:"
          find . -maxdepth 4 \( -name '*.tmj' -o -name '*.wam' -o -iname '*hackathon*.png' \) -print | head -200

      - name: Install dependencies
        run: npm install

      - name: Build map
        run: |
          # Skip the pre-existing broken test map for this build only; restore it immediately.
          if [ -f test1.tmj ]; then mv test1.tmj test1.tmj.integration-skip; fi
          trap 'if [ -f test1.tmj.integration-skip ]; then mv test1.tmj.integration-skip test1.tmj; fi' EXIT
          npm run buildmap

      - name: Commit integrated map files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- '*.tmj' '*.wam' '*.png' 'src/assets/**' 'src/animations/**' LICENSE.assets LICENSE.map INTEGRATE-INTO-YALLA1.md 2>/dev/null || true
          echo 'Staged changes:'
          git status --short
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No new map files to commit."
          else
            git commit -m "Add Great Place to Work map and assets"
            git push origin HEAD:master
          fi
