<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Great Place to Work — Original TMJ in 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17232b;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud,#help{position:fixed;z-index:2;color:#fff;background:#14252ddd;border:1px solid #ffffff24;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px)}#hud{top:12px;left:12px;max-width:calc(100vw - 24px)}#hud strong{display:block;font-size:15px}#hud span{font-size:12px;opacity:.8}#help{top:12px;right:12px;font-size:12px}#pad{position:fixed;bottom:20px;left:20px;width:124px;height:124px;border-radius:50%;background:#ffffff20;border:1px solid #ffffff60;z-index:3;touch-action:none;display:none}#nub{position:absolute;width:48px;height:48px;left:37px;top:37px;border-radius:50%;background:#ffffffa8;border:1px solid #fff}#reset{position:fixed;right:14px;bottom:18px;z-index:3;border:0;border-radius:12px;padding:11px 14px;color:white;background:#236b60;font-weight:700}#status{position:fixed;left:12px;bottom:12px;color:white;background:#14252dcc;padding:7px 10px;border-radius:8px;font-size:11px;z-index:2;max-width:70vw}@media(pointer:coarse){#pad{display:block}#help{top:auto;bottom:22px;right:12px;max-width:150px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="hud"><strong>Great Place to Work · 3D</strong><span>Rendering the real great-place-to-work.tmj layers</span></div><div id="help">Move: WASD / arrows<br>Drag to rotate · scroll to zoom</div><div id="pad"><div id="nub"></div></div><button id="reset">Reset view</button><div id="status">Loading original TMJ and tilesets…</div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const TILE=32;let W=79,D=92;const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc6d3);scene.fog=new THREE.Fog(0x9bc6d3,110,260);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,700);camera.position.set(86,95,115);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(W/2,0,D/2);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=18;controls.maxDistance=210;
scene.add(new THREE.HemisphereLight(0xe7f8ff,0x58634a,2.1));const sun=new THREE.DirectionalLight(0xfff0d8,2.5);sun.position.set(40,100,35);sun.castShadow=true;scene.add(sun);
const status=document.querySelector('#status');const mapGroup=new THREE.Group();scene.add(mapGroup);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0x8aab78,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.set(W/2,-.16,D/2);floor.receiveShadow=true;scene.add(floor);
let player;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function flatten(layers,out=[],parent=''){for(const l of layers||[]){const name=parent+'/'+l.name;if(l.type==='tilelayer'&&l.data)out.push({...l,_name:name});if(l.layers)flatten(l.layers,out,name)}return out}
function loadImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Cannot load '+url));im.src=url})}
function layerTexture(layer,tilesets,images,tw,th){
 const c=document.createElement('canvas');c.width=W*TILE;c.height=D*TILE;const ctx=c.getContext('2d');
 for(let i=0;i<layer.data.length;i++){let gid=layer.data[i]>>>0;if(!gid)continue;const flipH=(gid&0x80000000)!==0,flipV=(gid&0x40000000)!==0,flipD=(gid&0x20000000)!==0;gid=gid&0x1fffffff;
 let ts=null;for(const t of tilesets){if(t.firstgid<=gid)ts=t;else break}if(!ts||!images[ts.firstgid])continue;
 const local=gid-ts.firstgid,cols=ts.columns||Math.floor(ts.imagewidth/TILE),sx=(local%cols)*TILE,sy=Math.floor(local/cols)*TILE;
 const dx=(i%W)*TILE,dy=Math.floor(i/W)*TILE;ctx.save();ctx.translate(dx+TILE/2,dy+TILE/2);if(flipD)ctx.rotate(Math.PI/2);ctx.scale(flipH?-1:1,flipV?-1:1);ctx.drawImage(images[ts.firstgid],sx,sy,TILE,TILE,-TILE/2,-TILE/2,TILE,TILE);ctx.restore();
 }
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();return tex
}
async function buildOriginalMap(){
 const response=await fetch('./great-place-to-work.tmj');if(!response.ok)throw Error('TMJ load failed ('+response.status+')');const tmj=await response.json();W=tmj.width;D=tmj.height;
 floor.geometry.dispose();floor.geometry=new THREE.PlaneGeometry(W,D);floor.position.set(W/2,-.16,D/2);
 const ts=tmj.tilesets.slice().sort((a,b)=>a.firstgid-b.firstgid);const imgs={};
 await Promise.all(ts.map(async t=>{const url=t.source?'./'+t.source.replace(/^\.\//,''):'./'+t.image.replace(/^\.\//,'');try{imgs[t.firstgid]=await loadImage(url)}catch(e){console.warn(e.message)}}));
 const layers=flatten(tmj.layers);let rendered=0;let y=0.005;
 for(const layer of layers){if(!layer.data||!layer.data.some(v=>v!==0))continue;const tex=layerTexture(layer,ts,imgs);const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.025,side:THREE.DoubleSide,depthWrite:false});const mesh=new THREE.Mesh(new THREE.PlaneGeometry(W,D),mat);mesh.rotation.x=-Math.PI/2;mesh.position.set(W/2,y,D/2);mesh.renderOrder=rendered+1;mesh.userData.layer=layer._name;mapGroup.add(mesh);y+=.012;rendered++}
 // Collision overlay is intentionally not drawn; it is gameplay metadata, not artwork.
 player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.9,4,8),new THREE.MeshStandardMaterial({color:0xf4b544}));body.position.y=.85;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,16,12),new THREE.MeshStandardMaterial({color:0xffd2a1}));head.position.y=1.62;player.add(head);const marker=new THREE.Mesh(new THREE.ConeGeometry(.18,.35,12),new THREE.MeshStandardMaterial({color:0x37b8ff}));marker.position.set(0,2,.0);player.add(marker);player.position.set(W/2,0,D/2);scene.add(player);
 controls.target.set(W/2,0,D/2);status.textContent='Loaded original TMJ: '+W+'×'+D+' tiles · '+rendered+' artwork layers · '+ts.length+' tilesets';
}
buildOriginalMap().catch(e=>{console.error(e);status.textContent='Map loading error: '+e.message+' — check TMJ asset paths';});
let joy={x:0,y:0},drag=false;const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');function joyMove(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/42,y=(e.clientY-cy)/42,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joy={x,y};nub.style.transform='translate('+x*38+'px,'+y*38+'px)'}pad.addEventListener('pointerdown',e=>{drag=true;pad.setPointerCapture(e.pointerId);joyMove(e)});pad.addEventListener('pointermove',e=>{if(drag)joyMove(e)});function stopJoy(){drag=false;joy={x:0,y:0};nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',stopJoy);pad.addEventListener('pointercancel',stopJoy);
document.querySelector('#reset').onclick=()=>{camera.position.set(W*.9,D*1.03,D*1.25);controls.target.set(W/2,0,D/2);controls.update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(player){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;const len=Math.hypot(x,z);if(len>.08){x/=Math.max(1,len);z/=Math.max(1,len);player.position.x=THREE.MathUtils.clamp(player.position.x+x*dt*8,1,W-1);player.position.z=THREE.MathUtils.clamp(player.position.z+z*dt*8,1,D-1);player.rotation.y=Math.atan2(x,z);controls.target.lerp(new THREE.Vector3(player.position.x,0,player.position.z),.035)}}controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
