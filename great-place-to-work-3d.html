<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Great Place to Work — 3D map</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17232b;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud,#help{position:fixed;z-index:2;color:#fff;background:#14252ddd;border:1px solid #ffffff24;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px)}#hud{top:12px;left:12px;max-width:calc(100vw - 24px)}#hud strong{display:block;font-size:15px}#hud span{font-size:12px;opacity:.8}#help{top:12px;right:12px;font-size:12px}#pad{position:fixed;bottom:20px;left:20px;width:124px;height:124px;border-radius:50%;background:#ffffff20;border:1px solid #ffffff60;z-index:3;touch-action:none;display:none}#nub{position:absolute;width:48px;height:48px;left:37px;top:37px;border-radius:50%;background:#ffffffa8;border:1px solid #fff}#reset{position:fixed;right:14px;bottom:18px;z-index:3;border:0;border-radius:12px;padding:11px 14px;color:white;background:#236b60;font-weight:700}#status{position:fixed;left:12px;bottom:12px;color:white;background:#14252dcc;padding:7px 10px;border-radius:8px;font-size:11px;z-index:2;max-width:70vw}@media(pointer:coarse){#pad{display:block}#help{top:auto;bottom:22px;right:12px;max-width:150px}}
</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="hud"><strong>Great Place to Work · 3D</strong><span>Original TMJ map · real tiles and layer positions</span></div><div id="help">Move: WASD / arrows<br>Drag to rotate · scroll to zoom</div><div id="pad"><div id="nub"></div></div><button id="reset">Reset view</button><div id="status">Loading original map and artwork…</div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const TILE=32;let W=79,D=92;const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc6d3);scene.fog=new THREE.Fog(0x9bc6d3,115,270);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,800);camera.position.set(86,95,115);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(W/2,0,D/2);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=15;controls.maxDistance=210;
scene.add(new THREE.HemisphereLight(0xe7f8ff,0x58634a,2));const sun=new THREE.DirectionalLight(0xfff0d8,2.4);sun.position.set(40,100,35);sun.castShadow=true;scene.add(sun);
const status=document.querySelector('#status'),mapGroup=new THREE.Group();scene.add(mapGroup);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0x8aab78,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.set(W/2,-.18,D/2);floor.receiveShadow=true;scene.add(floor);
let player;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function flatten(layers,out=[],parent=''){for(const l of layers||[]){const name=parent+'/'+l.name;if(l.type==='tilelayer'&&l.data)out.push({...l,_name:name,_group:parent.split('/').filter(Boolean).pop()||l.name});if(l.layers)flatten(l.layers,out,name)}return out}
function loadImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Could not load image: '+url));im.src=url})}
function drawTile(ctx,im,ts,gid,dx,dy){let h=(gid&0x80000000)!==0,v=(gid&0x40000000)!==0,d=(gid&0x20000000)!==0;gid=gid&0x1fffffff;const local=gid-ts.firstgid,cols=ts.columns||Math.floor(ts.imagewidth/TILE),sx=(local%cols)*TILE,sy=Math.floor(local/cols)*TILE;ctx.save();ctx.translate(dx+TILE/2,dy+TILE/2);if(d)ctx.rotate(Math.PI/2);ctx.scale(h?-1:1,v?-1:1);ctx.drawImage(im,sx,sy,TILE,TILE,-TILE/2,-TILE/2,TILE,TILE);ctx.restore()}
function tilesetFor(gid,ts){gid=(Number(gid)>>>0)&0x1fffffff;let found=null;for(const t of ts){if(t.firstgid<=gid)found=t;else break}return found}
async function buildOriginalMap(){
 const res=await fetch('./great-place-to-work.tmj');if(!res.ok)throw Error('TMJ file not found at ./great-place-to-work.tmj');const tmj=await res.json();W=tmj.width;D=tmj.height;
 floor.geometry.dispose();floor.geometry=new THREE.PlaneGeometry(W,D);floor.position.set(W/2,-.18,D/2);
 const ts=tmj.tilesets.slice().sort((a,b)=>a.firstgid-b.firstgid),imgs={};
 await Promise.all(ts.map(async t=>{const path=t.source||t.image;if(!path)return;try{imgs[t.firstgid]=await loadImage('./'+path.replace(/^\.\//,''))}catch(e){console.warn(e.message)}}));
 const layers=flatten(tmj.layers);let floorCount=0,wallCount=0,otherCount=0,missingTiles=0;const tileCanvasCache=new Map(),tileTexCache=new Map();const collisionLayer=layers.find(l=>l.name==='collisions'||l._name.endsWith('/collisions'));const blocked=new Set();if(collisionLayer?.data)collisionLayer.data.forEach((v,i)=>{if(v)blocked.add(i)});const startLayer=layers.find(l=>l.name==='start'||l._name.endsWith('/start'));let spawn={x:W/2,z:D/2};if(startLayer?.data){const si=startLayer.data.findIndex(v=>v!==0);if(si>=0)spawn={x:si%W+.5,z:Math.floor(si/W)+.5};}
 function tileTex(gid){if(tileTexCache.has(gid))return tileTexCache.get(gid);const t=tilesetFor(gid,ts),im=t&&imgs[t.firstgid];if(!t||!im){missingTiles++;return null}const c=document.createElement('canvas');c.width=TILE;c.height=TILE;drawTile(c.getContext('2d'),im,t,gid,0,0);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.LinearFilter;tileTexCache.set(gid,tex);return tex}
 for(const layer of layers){
  if(!layer.data||!layer.data.some(v=>v!==0)||layer._name.endsWith('/collisions')||layer.name==='collisions'||layer.name==='start')continue;
  const isWall=layer._group==='Wall'||layer.name.trim().startsWith('Wall');const isAbove=layer._group==='Above'||layer.name==='Lights';
  if(isWall){
   // Render the actual wall tiles upright, at their original tile coordinates, with a little depth.
   const geo=new THREE.PlaneGeometry(1,1);let n=0;
   for(let i=0;i<layer.data.length;i++){const raw=layer.data[i]>>>0;if(!raw)continue;const gid=raw&0x1fffffff,tex=tileTex(raw);if(!tex)continue;
    const material=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.035,side:THREE.DoubleSide,depthWrite:true});
    const mesh=new THREE.Mesh(geo,material);mesh.position.set((i%W)+.5,.52+Math.floor(i/W)*0.0001,Math.floor(i/W)+.49);mesh.rotation.y=0;mesh.renderOrder=10+n%3;mapGroup.add(mesh);n++;
   }wallCount+=n;continue;
  }
  // Preserve every original floor/detail/above tile at its exact map cell on its own height plane.
  const c=document.createElement('canvas');c.width=W*TILE;c.height=D*TILE;const ctx=c.getContext('2d');let count=0;
  for(let i=0;i<layer.data.length;i++){const raw=layer.data[i]>>>0;if(!raw)continue;const gid=raw&0x1fffffff,t=tilesetFor(gid,ts),im=t&&imgs[t.firstgid];if(!t||!im)continue;drawTile(ctx,im,t,raw,(i%W)*TILE,Math.floor(i/W)*TILE);count++}
  if(!count)continue;const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.02,side:THREE.DoubleSide,depthWrite:false});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(W,D),mat);mesh.rotation.x=-Math.PI/2;mesh.position.set(W/2,isAbove?(.65+otherCount*.002):(.006+otherCount*.002),D/2);mesh.renderOrder=20+otherCount;mapGroup.add(mesh);otherCount++;floorCount+=count;
 }
 // A controllable placeholder avatar stands on the real map.
 player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.72,4,8),new THREE.MeshStandardMaterial({color:0xf4b544}));body.position.y=.66;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,14,10),new THREE.MeshStandardMaterial({color:0xffd2a1}));head.position.y=1.24;player.add(head);player.position.set(spawn.x,0,spawn.z);scene.add(player);
 controls.target.set(W/2,0,D/2);status.textContent='الخريطة الأصلية: '+W+'×'+D+' بلاطة · حوائط '+wallCount+' · تفاصيل وأرضيات '+floorCount+(missingTiles?' · بلاطات لم تُحمّل '+missingTiles:'')+' · التصادم مفعّل';
}
buildOriginalMap().catch(e=>{console.error(e);status.textContent='Map load error: '+e.message+' (check the original TMJ asset paths)'});
let joy={x:0,y:0},drag=false;const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');function joyMove(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/42,y=(e.clientY-cy)/42,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joy={x,y};nub.style.transform='translate('+x*38+'px,'+y*38+'px)'}pad.addEventListener('pointerdown',e=>{drag=true;pad.setPointerCapture(e.pointerId);joyMove(e)});pad.addEventListener('pointermove',e=>{if(drag)joyMove(e)});function stopJoy(){drag=false;joy={x:0,y:0};nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',stopJoy);pad.addEventListener('pointercancel',stopJoy);
document.querySelector('#reset').onclick=()=>{camera.position.set(W*.9,D*1.03,D*1.25);controls.target.set(W/2,0,D/2);controls.update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(player){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;const len=Math.hypot(x,z);if(len>.08){x/=Math.max(1,len);z/=Math.max(1,len);const speed=dt*4.5,nx=THREE.MathUtils.clamp(player.position.x+x*speed,.35,W-.35),nz=THREE.MathUtils.clamp(player.position.z+z*speed,.35,D-.35);const cell=(px,pz)=>Math.floor(pz)*W+Math.floor(px);if(!blocked.has(cell(nx,player.position.z)))player.position.x=nx;if(!blocked.has(cell(player.position.x,nz)))player.position.z=nz;player.rotation.y=Math.atan2(x,z);controls.target.lerp(new THREE.Vector3(player.position.x,0,player.position.z),.035)}}controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
